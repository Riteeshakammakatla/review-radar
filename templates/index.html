<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Semantic Review Search — Upload CSV reviews and search through them with an intelligent, modern interface." />
  <title>Semantic Review Search | Review Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>

  <!-- ===== NAVBAR ===== -->
  <nav id="navbar">
    <div class="nav-inner">
      <div class="nav-brand">
        <div class="nav-logo" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </div>
        <h1>Review Radar AI</h1>
      </div>
      <div class="nav-status" id="nav-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">No data loaded</span>
      </div>
    </div>
  </nav>

  <main>
    <!-- ===== UPLOAD SECTION ===== -->
    <section id="upload-section" class="card fade-in">
      <div class="section-header">
        <div class="section-icon upload-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
        </div>
        <div>
          <h2>Upload Reviews</h2>
          <p class="section-subtitle">Import a CSV file containing your review data</p>
        </div>
      </div>

      <div class="upload-zone" id="upload-zone">
        <div class="upload-zone-content">
          <div class="upload-zone-icon" aria-hidden="true">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
              <polyline points="10 9 9 9 8 9" />
            </svg>
          </div>
          <p class="upload-zone-text">Drag &amp; drop your CSV file here</p>
          <p class="upload-zone-hint">or click to browse</p>
        </div>
        <input type="file" id="file-input" accept=".csv" hidden />
      </div>

      <div class="upload-actions">
        <div class="file-info" id="file-info">
          <span class="file-name" id="file-name">No file selected</span>
        </div>
        <button id="upload-btn" class="btn btn-teal" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          Upload File
        </button>
      </div>

      <!-- Upload feedback -->
      <div class="feedback" id="upload-feedback" hidden>
        <div class="feedback-inner" id="upload-feedback-inner"></div>
      </div>
    </section>

    <!-- ===== SEARCH SECTION ===== -->
    <section id="search-section" class="card fade-in">
      <div class="section-header">
        <div class="section-icon search-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </div>
        <div>
          <h2>Search Reviews</h2>
          <p class="section-subtitle">Enter a query to find matching reviews</p>
        </div>
      </div>

      <div class="search-bar" id="search-bar">
        <input type="text" id="search-input" placeholder="e.g. battery life, customer service, delivery issues…"
          disabled />
        <button id="search-btn" class="btn btn-navy" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          Search
        </button>
      </div>
    </section>

    <!-- ===== RESULTS SECTION ===== -->
    <section id="results-section" class="fade-in" hidden>
      <div class="results-header">
        <h2>Results</h2>
        <span class="results-count" id="results-count"></span>
      </div>
      <div id="results-container"></div>
    </section>

    <!-- ===== LOADING OVERLAY ===== -->
    <div class="loading-overlay" id="loading-overlay" hidden>
      <div class="spinner-wrap">
        <div class="spinner"></div>
        <p id="loading-text">Processing…</p>
      </div>
    </div>
  </main>

  <script src="/static/script.js"></script>
</body>

</html>
